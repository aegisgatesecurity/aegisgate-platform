# AegisGate Adversarial Detection Corpus
# Versioned asset — expand monthly with real-world attack phrasings from
# disclosed incidents, security advisories, and adversarial AI research.
#
# Each payload has:
#   id:           unique identifier
#   text:         the attack/benign prompt text
#   type:         adversarial | benign
#   expect:       blocked | allowed (what AegisGate should do)
#   pattern:      expected pattern name (for adversarial only)
#   category:     OWASP LLM / ATLAS / Prompt Injection / Compliance
#   source:       where this payload was derived from
#
# The k6 detection-gate test (tests/load/k6/detection-gate.js) mirrors these
# payloads. Currently the payloads are hardcoded in both files — keep them in
# sync. TODO: generate detection-gate.js from this file to eliminate drift.
# CI fails if detection < 100% or FPR > 0%.

version: "1.1.0"
