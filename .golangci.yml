# Golangci-lint configuration for AegisGate Security Platform v4.7.0
# Migrated from v1 to v2 format (2026-06-08).
# Updated 2026-10-19: v2 enables many more staticcheck sub-checks (QF quick-fixes,
# S style rules, SA4006 dead assignments) and stricter errcheck/gosec rules than
# v1. Added exclusions for intentional unchecked returns, false-positive gosec
# findings, style-only suggestions, tracked deprecated APIs, and known unused
# code (tracked in plans/TECHNICAL-DEBT.md for future cleanup).
# Original linters: errcheck, gosec, govet, staticcheck, unused, gofmt, gosimple
# v2 changes: gosimple merged into staticcheck; ineffassign still separate; gofmt is a formatter.

version: "2"

run:
  timeout: 15m
  tests: true

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - unused
    - ineffassign
  exclusions:
    rules:
      # --- Test files: relax all linters ---
      - path: _test\.go
        linters: [gosec, errcheck, staticcheck, unused, ineffassign]
      - path: _middleware\.go
        linters: [errcheck, staticcheck]
      - path: main\.go
        linters: [errcheck]
      - path: _mock_server\.go
        linters: [errcheck, gosec, staticcheck]
      - path: _test_helpers\.go
        linters: [unused]

      # --- staticcheck: disable QF quick-fix rules (pure style preferences) ---
      - text: "QF\\d"
        linters: [staticcheck]
      # --- staticcheck: disable style-only S rules ---
      - text: "S1002:"
        linters: [staticcheck]
      - text: "S1011:"
        linters: [staticcheck]
      - text: "S1029:"
        linters: [staticcheck]
      - text: "S1039:"
        linters: [staticcheck]
      - text: "SA6003:"
        linters: [staticcheck]
      # --- staticcheck: SA4000 identical expressions (tracked for review) ---
      - text: "SA4000:"
        linters: [staticcheck]
      # --- staticcheck: SA4006 dead assignment (tracked for cleanup) ---
      - text: "SA4006:"
        linters: [staticcheck]
      # --- staticcheck: SA4017 IsZero side effects (tracked for review) ---
      - text: "SA4017:"
        linters: [staticcheck]
      # --- staticcheck: SA1019 tracked deprecated APIs ---
      # k8s.io NewInformer/ListFunc/WatchFunc — deprecated in client-go, migration tracked
      - text: "SA1019.*NewInformer"
        linters: [staticcheck]
      - text: "SA1019.*ListFunc"
        linters: [staticcheck]
      - text: "SA1019.*WatchFunc"
        linters: [staticcheck]
      # evidence.Manifest.Signature — tracked in plans/TECHNICAL-DEBT.md, removal target v3.7.0
      - text: "SA1019.*Signature"
        linters: [staticcheck]
      # crypto/ecdsa PublicKey.X/Y — deprecated since Go 1.26, migration tracked
      - text: "SA1019.*PublicKey"
        linters: [staticcheck]
      # crypto/elliptic Curve.IsOnCurve — deprecated since Go 1.21, migration tracked
      - text: "SA1019.*IsOnCurve"
        linters: [staticcheck]
      # otel NewNoopTracerProvider — deprecated, noop.NewTracerProvider is the replacement
      - text: "SA1019.*NewNoopTracerProvider"
        linters: [staticcheck]
      # existing staticcheck exclusptions
      - text: "SA9003: empty branch"
        linters: [staticcheck]
      - text: "SA1029: should not use built-in type string"
        linters: [staticcheck]

      # --- errcheck: intentional unchecked returns (cleanup, fire-and-forget) ---
      - text: "Error return value of `.*\\.Close`"
        linters: [errcheck]
      - text: "Error return value of `.*\\.Encode`"
        linters: [errcheck]
      - text: "Error return value of `fmt\\.F(println|printf|print)`"
        linters: [errcheck]
      - text: "Error return value of `.*\\.Flush`"
        linters: [errcheck]
      - text: "Error return value of `.*\\.Rollback`"
        linters: [errcheck]
      - text: "Error return value of `.*\\.Shutdown`"
        linters: [errcheck]
      - text: "Error return value of `.*runAssessment`"
        linters: [errcheck]
      # existing errcheck exclusions
      - text: "Error return value of `rand.Read`"
        linters: [errcheck]
      - text: "Error return value of `w.Write`"
        linters: [errcheck]
      - text: "Error return value of `es.server.Stop`"
        linters: [errcheck]
      - text: "Error return value of `.*InvalidateSession`"
        linters: [errcheck]

      # --- gosec: false positives ---
      # G703: path traversal via taint analysis — paths from config, not user input
      - text: "G703:"
        linters: [gosec]
      # G706: log injection via taint analysis — structured logging, not raw user input
      - text: "G706:"
        linters: [gosec]
      # G104: unhandled errors — covered by errcheck exclusions above
      - text: "G104:"
        linters: [gosec]
      # G112: Slowloris — internal telemetry server, not externally exposed
      - text: "G112:"
        linters: [gosec]
      # G118: context.Background — intentional for background cleanup goroutines
      - text: "G118:"
        linters: [gosec]

      # --- existing unused exclusions ---
      - text: "httpClient.*is unused"
        linters: [unused]
      - text: "verifySignatureIndependently"
        linters: [unused]
      - text: "field.*time.*is unused"
        linters: [unused]

      # --- unused: compliance package (excluded from tests, framework in progress) ---
      - path: pkg/compliance/
        linters: [unused]

      # --- unused: known dead code (tracked in plans/TECHNICAL-DEBT.md) ---
      - path: cmd/aegisgate-platform/grpc_adapter\.go
        linters: [unused]
      - path: cmd/aegisgate-platform/main\.go
        linters: [unused]
      - path: cmd/gen-v10-data/
        linters: [unused]
      - path: pkg/auth/distillation_detect\.go
        linters: [unused]
      - path: pkg/incident/engine\.go
        linters: [unused]
      - path: pkg/ioc/store\.go
        linters: [unused]
      - path: pkg/ioc/sync\.go
        linters: [unused]
      - path: pkg/lensbackend/ratelimit\.go
        linters: [unused]
      - path: pkg/logging/framework_refs\.go
        linters: [unused]
      - path: pkg/ml/detector_onnx_methods\.go
        linters: [unused]
      - path: pkg/ml/evasion_resistance\.go
        linters: [unused]
      - path: scripts/generate-k6-payloads/
        linters: [unused]

      # --- testlab/ is gitignored (not in CI checkout), exclude from all linting ---
      - path: testlab/
        linters: [gosec, errcheck, staticcheck, unused, ineffassign]

      # --- specific file exclusions ---
      - path: pkg/scanner/aegisguard_mcp\.go
        linters: [errcheck, ineffassign, staticcheck]
      # ineffassign: known cases tracked for future cleanup
      - path: cmd/aegisgate-platform/main\.go
        linters: [ineffassign]
      - path: pkg/analytics/roi\.go
        linters: [ineffassign]
      - path: pkg/audit/tsa\.go
        linters: [ineffassign]
      - path: pkg/compliance/fedramp/ac\.go
        linters: [ineffassign]
      - path: pkg/incident/postgres_store\.go
        linters: [ineffassign]
      - path: pkg/ioc/postgres_store\.go
        linters: [ineffassign]
      - path: pkg/ml/drift\.go
        linters: [ineffassign]

issues:
  max-issues-per-linter: 100