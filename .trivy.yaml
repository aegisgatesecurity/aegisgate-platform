# Trivy Configuration
# https://aquasecurity.github.io/trivy/latest/docs/configuration/
# Updated for Trivy 0.71+ (replaced deprecated scan.security-checks with scan.scanners)

scan:
  scanners:
    - vuln
    - misconfig
    - secret

severity:
  - CRITICAL
  - HIGH
  - MEDIUM

vulnerability:
  types:
    - os
    - library
  ignore-vulnerabilities:
    - vulnerability-id: CVE-2026-76844
      reason: "webpack-dev-middleware — no npm/webpack in repo, static HTML/CSS/JS frontend only"
    - vulnerability-id: CVE-2026-84243
      reason: "glibc LANGUAGE env var — Go binary uses own locale handling, not exploitable"
    - vulnerability-id: CVE-2026-114690
      reason: "gcc compiler CVE — runtime image has libstdc++6 only, no gcc compiler"
    - vulnerability-id: CVE-2026-114691
      reason: "gcc compiler CVE — runtime image has libstdc++6 only, no gcc compiler"
    - vulnerability-id: CVE-2026-115456
      reason: "gcc compiler CVE — runtime image has libstdc++6 only, no gcc compiler"

# Ignore certain paths
skip-dirs:
  - tests/
  - docs/
  - "*.md"

# IaC scanning configuration
misconfig:
  include:
    - Dockerfile
    - docker-compose.yml
    - ".github/workflows/*.yml"
  # KSV-0125 flags images not from "trusted" registries. ghcr.io is
  # GitHub's container registry and is trusted — this is a false positive.
  skip-files:
    - "deploy/k8s/manifests/03-deployment.yaml"

# Secret scanning
secret:
  enabled: true
  config:
    # Additional patterns to scan for
    show-secrets: false

# Report format
format: table

# Exit codes
exit-code: 0

# Cache
cache:
  backend: fs