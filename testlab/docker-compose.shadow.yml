# =========================================================================
# AegisGate Synthetic Test Environment — Validation Override
# =========================================================================
#
# Override file for TPR validation tests. L3 is now in BLOCKING mode
# (flipped after 7-day shadow validation: 0% FPR, 99.57% TPR).
# P2/P4/DIST2-5 remain alert-only (BlockOnAlert=false).
#
# Uses mock upstream on :18888 for instant responses (shadow detectors
# run pre-forward, so FPR/TPR measurement is unaffected).
#
# Usage:
#   docker compose -f docker-compose.synth.yml -f docker-compose.shadow.yml up -d
#
# Then run:
#   k6 run --env BASE_URL=http://localhost:8080 testlab/k6/shadow-p2-tpr.js
#   k6 run --env BASE_URL=http://localhost:8080 testlab/k6/shadow-p4-tpr.js
#   k6 run --env BASE_URL=http://localhost:8080 testlab/k6/shadow-dist-tpr.js
# =========================================================================

services:
  aegisgate:
    # Override command: mock upstream on :18888 for instant responses
    command: >
      --mode=staging
      --license-public-key=/data/license-public.pem
      --proxy-port=8080
      --mcp-port=8081
      --dashboard-port=8443
      --grpc-addr=:50051
      --embedded-mcp
      --target=http://host.docker.internal:18888
    environment:
      # L3 ML Threat Detection — BLOCKING mode (flipped after shadow validation)
      AEGISGATE_ML_THREAT_DETECTION_ENABLED: "true"
      AEGISGATE_ML_SHADOW_MODE: "false"
      AEGISGATE_ML_SENSITIVITY: "high"
      AEGISGATE_ML_MIN_SCORE_TO_BLOCK: "0.5"
      AEGISGATE_ML_MODEL_PATH: "/data/models/threat_cnn_bilstm.onnx"
      # P2/P4/DIST2-5 remain alert-only (BlockOnAlert=false in proxy.go)
    volumes:
      - ./models:/data/models:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"