# =========================================================================
# AegisGate Synthetic Test Environment — Shadow Validation Override
# =========================================================================
#
# Override file for shadow mode FPR validation. Enables ALL shadow
# detectors (P2, P4, L3) in alert-only mode for 7-day simulation.
#
# Usage:
#   docker compose -f docker-compose.synth.yml -f docker-compose.shadow.yml up -d
#
# Then run:
#   k6 run --env BASE_URL=http://localhost:8080 \
#     testlab/k6/shadow-validation-7day.js
# =========================================================================

services:
  aegisgate:
    environment:
      # ML Threat Detection — ENABLED in SHADOW mode (alert-only, no blocking)
      AEGISGATE_ML_THREAT_DETECTION_ENABLED: "true"
      AEGISGATE_ML_SHADOW_MODE: "true"
      AEGISGATE_ML_SENSITIVITY: "high"
      AEGISGATE_ML_MIN_SCORE_TO_BLOCK: "0.5"
      # Shadow detectors P2/P4 are always alert-only by design (BlockOnAlert=false)
      # DIST2-5 are alert-only by design (distillation_detect.go)
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"