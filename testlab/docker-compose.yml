# AegisGate Test Lab - Docker Compose Configuration

services:
  # ---------------------------------------------------------------------------
  # Keycloak - Real OIDC + SAML Identity Provider
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: aegisgate-keycloak
    hostname: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "9080:8080"
      - "9443:8443"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /realms/master HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3;timeout 1 cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - aegisgate-test

  # ---------------------------------------------------------------------------
  # PostgreSQL - Test Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aegisgate-postgres-test
    environment:
      POSTGRES_DB: aegisgate_test
      POSTGRES_USER: aegisgate
      POSTGRES_PASSWORD: aegisgate_test_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisgate -d aegisgate_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegisgate-test

  # ---------------------------------------------------------------------------
  # Redis - Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegisgate-redis-test
    ports:
      - "6379:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegisgate-test

  # ---------------------------------------------------------------------------
  # AegisGate Test Instance
  # ---------------------------------------------------------------------------
  aegisgate-test:
    image: testlab-aegisgate-test:local
    container_name: aegisgate-test-instance
    hostname: aegisgate-test
    command: ["--proxy-port=8080", "--mcp-port=8081", "--dashboard-port=8443", "--embedded-mcp", "--tier=community", "--target=http://host.docker.internal:11434"]
    environment:
      AEGISGATE_TIER: developer
      AEGISGATE_UPSTREAM: "http://host.docker.internal:11434/v1"
      DATABASE_URL: postgres://aegisgate:aegisgate_test_pass@postgres:5432/aegisgate_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SSO_OIDC_ISSUER_URL: http://keycloak:8080/realms/aegisgate
      SSO_OIDC_CLIENT_ID: aegisgate-platform
      SSO_OIDC_CLIENT_SECRET: aegisgate-oidc-secret
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_TLS_ENABLED: "false"
      LOG_LEVEL: info
      MCP_ENABLED: "true"
      EMBEDDED_MCP: "true"
      MCP_PORT: 8081
      # Federated IOC library (v3.5.0+ Track 6):
      # SHARE=true so the instance serves its IOC manifest on
      # /api/v1/ioc/manifest. RECEIVE=false because this is a
      # developer-tier instance (the tier gate in pkg/ioc/sync.go
      # would block receive even if we set it to true, but
      # setting it explicitly makes the intent clear).
      AEGISGATE_IOC_SHARE: "true"
      AEGISGATE_IOC_RECEIVE: "false"
      # PostgreSQL storage backend (D1 Phase 1A/1B/1C):
      # Connects the shared PostgresStore to IOC, audit, RBAC, and license.
      # The PostgresStore owns the connection pool; other subsystems borrow it.
      AEGISGATE_DATABASE_URL: "postgres://aegisgate:aegisgate_test_pass@postgres:5432/aegisgate_test?sslmode=disable"
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aegisgate-test

  # ---------------------------------------------------------------------------
  # AegisGate Test Instance 2 (Track 6 Task 2 - cross-instance testing)
  # Different tier (professional) + different ports for tier-mismatch
  # and federated trust tests. Used by cross_instance_lab_test.go.
  # ---------------------------------------------------------------------------
  aegisgate-test-2:
    image: testlab-aegisgate-test:local
    container_name: aegisgate-test-instance-2
    hostname: aegisgate-test-2
    environment:
      AEGISGATE_TIER: professional
      DATABASE_URL: postgres://aegisgate:aegisgate_test_pass@postgres:5432/aegisgate_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SSO_OIDC_ISSUER_URL: http://keycloak:8080/realms/aegisgate
      SSO_OIDC_CLIENT_ID: aegisgate-platform
      SSO_OIDC_CLIENT_SECRET: aegisgate-oidc-secret
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 9080
      SERVER_TLS_ENABLED: "false"
      LOG_LEVEL: info
      MCP_ENABLED: "true"
      MCP_PORT: 9081
      # Federated IOC library (v3.5.0+ Track 6):
      # This is a professional-tier instance, so it can both
      # share and receive. We point PEERS at instance A
      # (aegisgate-test) on the internal docker network so
      # instance B can fetch and verify instance A's IOC
      # manifest. The gossip run loop is a 5-minute ticker;
      # for the lab test, the testlab gossip test exercises
      # the same primitive directly via httptest servers.
      AEGISGATE_IOC_SHARE: "true"
      AEGISGATE_IOC_RECEIVE: "true"
      AEGISGATE_IOC_PEERS: "http://aegisgate-test:8080"
      # PostgreSQL storage backend (D1 Phase 1A/1B/1C):
      AEGISGATE_DATABASE_URL: "postgres://aegisgate:aegisgate_test_pass@postgres:5432/aegisgate_test?sslmode=disable"
    ports:
      - "7080:9080"
      - "7443:9443"
      - "7081:9081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aegisgate-test

  # ---------------------------------------------------------------------------
  # Mailpit - SMTP Test Server
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: aegisgate-mailpit
    hostname: mailpit
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_SMTP_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "1026:1026"
      - "1043:1043"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
      - ./certs:/certs:ro
    command: ["--smtp-tls-cert", "/certs/mailpit-tls.crt", "--smtp-tls-key", "/certs/mailpit-tls.key"]
    networks:
      - aegisgate-test

  # ---------------------------------------------------------------------------
  # AegisGate Lens Backend - HTTP service for the Chrome extension
  # ---------------------------------------------------------------------------
  # This service is added in 2026-06-18 (Lens Phase 2). It runs the
  # lensbackend package from the Platform monorepo, listens on
  # 9090, and is on the same aegisgate-test network as the other
  # services so the testlab integration tests can reach it.
  #
  # The bearer token is the well-known test token used by the
  # LAB_ENABLED=1 go test -tags=lab integration test. In
  # production, LENS_BEARER_TOKEN is set to a 32-byte random
  # value and rotated quarterly.
  #
  # The IOC store is persisted to a named volume so the tests
  # can inspect it across restarts.
  # ---------------------------------------------------------------------------
  lensbackend:
    build:
      context: ..
      dockerfile: testlab/Dockerfile.lensbackend
    image: aegisgate-lensbackend:test
    container_name: aegisgate-lensbackend
    hostname: lensbackend
    environment:
      LENS_PORT: "9090"
      LENS_BEARER_TOKEN: "test-bearer-token-lensbackend"
      LENS_IOC_STORE_PATH: "/data"
      LENS_RATE_LIMIT_PER_MIN: "10000"
      LENS_EVENT_RETENTION_DAYS: "90"
      LENS_PUBLIC_URL: "http://lensbackend:9090"
    ports:
      - "9090:9090"
    volumes:
      - lensbackend-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/api/v1/lens/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aegisgate-test

volumes:
  keycloak-data:
  postgres-test-data:
  redis-test-data:
  mailpit-data:
  lensbackend-data:

networks:
  aegisgate-test:
    driver: bridge
