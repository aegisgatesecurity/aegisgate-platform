# =========================================================================
# AegisGate Security Platform — Deployment
# =========================================================================
# Single replica (Community tier). Scale up for Professional/Enterprise.
# Ports: 8080 (proxy), 8081 (MCP), 8443 (dashboard/API)
# Zero-config: all defaults embedded in the binary
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgate-platform
  namespace: aegisgate
  labels:
    app.kubernetes.io/name: aegisgate-platform
    # Updated 2026-08-05: aligned to v4.0.0 (ML threat detection release).
    app.kubernetes.io/version: "4.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisgate-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisgate-platform
        app.kubernetes.io/version: "4.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8443"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aegisgate-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          # v3.3.1 hardening: use the container runtime's default seccomp
          # profile (which is the secure default for most Linux distros and
          # matches Docker's default profile). Was previously unset, which
          # meant containers ran in "unconfined" mode (no syscall filtering).
          type: RuntimeDefault
      containers:
        - name: aegisgate-platform
          image: ghcr.io/aegisgatesecurity/aegisgate-platform:4.0.0
          imagePullPolicy: IfNotPresent
          # imagePullSecrets:
          #   - name: ghcr-pull-secret
          args:
            - "--proxy-port=8080"
            - "--mcp-port=8081"
            - "--dashboard-port=8443"
            - "--embedded-mcp"
            # Removed 2026-07-20 (audit Finding #2): --tier=community was
            # deprecated in D0 (Sprint 7). Tier is now derived from the
            # license key, set via AEGISGATE_LICENSE_KEY env or --license flag.
            # Without a license key, the platform runs in Community tier
            # automatically.
          env:
            - name: AEGISGATE_DATA_DIR
              value: /data
            # ML threat detection (v4.0.0): ONNX model path inside container.
            # The model file is at /opt/aegisgate-platform/models/threat_cnn_bilstm.onnx
            # and libonnxruntime.so is installed via the Alpine package manager.
            - name: AEGISGATE_ML_MODEL_PATH
              value: /opt/aegisgate-platform/models/threat_cnn_bilstm.onnx
            # Removed 2026-07-20 (audit Finding #2): TIER=community is the
            # same deprecated path. Tier is license-derived; setting TIER
            # does not change behavior since D0.
            # To unlock Professional+ features, set AEGISGATE_LICENSE_KEY.
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 8081
              protocol: TCP
            - name: dashboard
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            # v3.3.1 hardening: seccompProfile at the container level (defense in
            # depth — the pod-level profile above is the primary, this is a backup
            # for clusters that don't propagate pod-level profiles to containers).
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: aegisgate-data