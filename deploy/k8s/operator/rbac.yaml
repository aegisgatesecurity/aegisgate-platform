---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisgate-operator
  namespace: aegisgate-system
  labels:
    app.kubernetes.io/name: aegisgate-operator
    app.kubernetes.io/part-of: aegisgate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegisgate-operator
  labels:
    app.kubernetes.io/name: aegisgate-operator
    app.kubernetes.io/part-of: aegisgate
rules:
  # Custom resource: AegisGateDeployment
  - apiGroups:
      - aegisgate.io
    resources:
      - aegisgatedeployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Custom resource status subresource
  - apiGroups:
      - aegisgate.io
    resources:
      - aegisgatedeployments/status
    verbs:
      - get
      - update
      - patch
  # Custom resource finalizers subresource
  - apiGroups:
      - aegisgate.io
    resources:
      - aegisgatedeployments/finalizers
    verbs:
      - update
  # Deployments — operator creates/manages platform Deployments (KSV-0048: required)
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Services — operator creates platform Services (KSV-0056: required for operator function)
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # ConfigMaps — operator creates platform ConfigMaps (KSV-0049: required for operator function)
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Secrets — read-only: operator reads license keys, never creates/deletes
  # (KSV-0041: intentional, scoped to read-only)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # Pods — operator reads Pod status for health reporting (KSV-0048: required, read-only)
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  # HorizontalPodAutoscalers
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisgate-operator
  labels:
    app.kubernetes.io/name: aegisgate-operator
    app.kubernetes.io/part-of: aegisgate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegisgate-operator
subjects:
  - kind: ServiceAccount
    name: aegisgate-operator
    namespace: aegisgate-system