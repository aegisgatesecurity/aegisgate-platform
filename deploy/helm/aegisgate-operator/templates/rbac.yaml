{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisgate-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aegisgate-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aegisgate-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: aegisgate-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["aegisgate.io"]
    resources: ["aegisgatedeployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aegisgate.io"]
    resources: ["aegisgatedeployments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aegisgate-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: aegisgate-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aegisgate-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aegisgate-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}