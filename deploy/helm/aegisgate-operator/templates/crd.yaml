{{- if .Values.crd.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aegisgatedeployments.aegisgate.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: aegisgate.io
  names:
    kind: AegisGateDeployment
    listKind: AegisGateDeploymentList
    singular: aegisgatedeployment
    plural: aegisgatedeployments
    shortNames:
      - agd
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  default: 1
                image:
                  type: string
                  default: "ghcr.io/aegisgatesecurity/aegisgate-platform:v4.3.2"
                tier:
                  type: string
                  enum: ["community", "professional", "enterprise"]
                  default: "community"
                proxyPort:
                  type: integer
                  default: 8080
                mcpPort:
                  type: integer
                  default: 8081
                dashboardPort:
                  type: integer
                  default: 8443
                mlEnabled:
                  type: boolean
                  default: false
                mlShadowMode:
                  type: boolean
                  default: false
                mlThreshold:
                  type: number
                  default: 0.5
                licenseKeySecret:
                  type: string
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                persistence:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    size:
                      type: string
                      default: "1Gi"
                compliance:
                  type: object
                  properties:
                    frameworks:
                      type: array
                      items:
                        type: string
                    regressionGate:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
                ready:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
{{- end }}