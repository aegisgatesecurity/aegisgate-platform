# =========================================================================
# AegisGate Security Platform — Helm Values
# =========================================================================
# Deploy: helm install aegisgate ./deploy/helm/aegisgate-platform
# Upgrade: helm upgrade aegisgate ./deploy/helm/aegisgate-platform
#
# All values map to the platform's CLI flags and environment variables.
# The binary is zero-config; these values override the embedded defaults.
# =========================================================================

# -- Platform tier is now derived from the license key.
# Set AEGISGATE_LICENSE_KEY in the secrets section to unlock Developer+ features.
# Without a license key, the platform runs in Community tier.
# tier: community  # DEPRECATED — tier is now license-derived

# -- Image configuration
image:
  repository: ghcr.io/aegisgatesecurity/aegisgate-platform
  tag: "v4.0.0"
  pullPolicy: IfNotPresent
  # pullSecrets: []

# -- Replica count (adjust based on load)
replicaCount: 1

# -- Service account for pod identity
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Pod security context (runs as non-root appuser, seccomp RuntimeDefault)
# v3.3.1 hardening: seccompProfile.type: RuntimeDefault applies the container
# runtime's default seccomp profile (typically Docker's default, which blocks
# dangerous syscalls). This is a v1.25+ K8s feature.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (read-only root FS, no privilege escalation, seccomp RuntimeDefault)
# v3.3.1 hardening: seccompProfile.type: RuntimeDefault at the container level
# for defense in depth (in case pod-level profile is not propagated).
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# -- Port configuration (matches CLI defaults)
ports:
  proxy: 8080       # AegisGate AI API proxy
  mcp: 8081         # AegisGuard MCP server
  dashboard: 8443   # Admin dashboard & API

# -- Service type and annotations
service:
  type: ClusterIP
  annotations: {}
  # For LoadBalancer exposure:
  # type: LoadBalancer
  # loadBalancerIP: ""

# -- Ingress for dashboard and API (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aegisgate.local
      paths:
        - path: /
          pathType: Prefix
          port: 8443
  tls: []
  #  - secretName: aegisgate-tls
  #    hosts:
  #      - aegisgate.local

# -- Resource requests and limits
# Community tier: minimal resources; Professional+ may need more
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Node selector for pod placement
nodeSelector: {}

# -- Tolerations for pod placement
tolerations: []

# -- Affinity rules
affinity: {}

# -- Topology spread constraints (for multi-replica Professional+)
topologySpreadConstraints: []

# -- Persistent volume for audit logs, certificates, and data
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce
  # existingClaim: ""

# -- Environment variable overrides (applied to all containers)
env:
  AEGISGATE_DATA_DIR: /data
  # ML threat detection (v4.0.0): ONNX model path inside container.
  # The model ships at /opt/aegisgate-platform/models/threat_cnn_bilstm.onnx
  # and libonnxruntime.so is installed via Alpine package manager.
  AEGISGATE_ML_MODEL_PATH: /opt/aegisgate-platform/models/threat_cnn_bilstm.onnx
  # OPENAI_API_KEY: ""         # Set via secrets below
  # AEGISGATE_LICENSE_KEY: ""  # Set via secrets below

# -- Secrets (mounted as environment variables)
secrets: {}
  # openaiApiKey: ""
  # license-key: ""    # Set to unlock Developer+ tiers

# -- Health check configuration
healthCheck:
  # Proxy health probe
  proxy:
    path: /health
    port: 8080
  # Dashboard health probe (also checks MCP scanner)
  dashboard:
    path: /health
    port: 8443
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# -- Prometheus metrics scrape configuration
metrics:
  enabled: true
  path: /metrics
  port: 8443
  interval: 30s
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    labels: {}
    #   release: prometheus

# -- Redis for Developer+ tier shared state (not needed for Community)
redis:
  enabled: false
  # image: redis:7-alpine
  # persistence:
  #   enabled: true
  #   size: 1Gi

# -- Federated IOC Library (v3.4.0+ Track 6)
# The Federated IOC Library is a feature-flagged addition:
# default is OFF (opt-in). Operators enable share and/or
# receive via the values below. Both require Professional+
# tier (license-derived).
ioc:
  # share: enable publishing this instance's IOCs to peers
  # (default false = opt-in). When enabled, the platform
  # produces signed bundles of locally-detected threats and
  # serves them at /api/v1/ioc/manifest for peer fetches.
  share: false
  # receive: enable fetching IOCs from configured peers
  # (default false = opt-in). When enabled, the platform
  # pulls peer bundles on the gossip interval and ingests
  # IOCs after signature + reputation checks. Requires
  # Professional+ tier.
  receive: false
  # peers: comma-separated list of peer base URLs to fetch
  # bundles from. Example: https://peer-a.example.com,https://peer-b.example.com
  peers: ""
  # storeDir: on-disk path for the IOC store. Defaults to
  # ${AEGISGATE_DATA_DIR}/ioc which is the per-pod PVC.
  storeDir: /data/ioc
  # gossipInterval: how often to fetch peer bundles. Go
  # duration syntax. Default 5m (matches the platform default).
  # Lower values mean faster IOC freshness but more network
  # traffic. 1m is a reasonable minimum.
  gossipInterval: 5m

# -- Cross-Protocol Evidence (v3.4.0+ c1)
# Enables the cross-protocol evidence aggregation primitive.
# The single signed artifact at /api/v1/compliance/evidence/cross_protocol/build
# answers the CISO question "did AegisGate detect prompt
# injection via MCP or HTTP in Q1?" with one signed JSON.
crossProtocolEvidence:
  enabled: true

# -- Verifiable Compliance Primitive (v3.4.0+ c3)
# Exposes the platform's evidence-signing public key at the
# canonical /.well-known/aegisgate-evidence-pubkey.pem URL so
# auditors can fetch it and verify manifests without platform
# access. The verify endpoint also accepts ?expected_key_id=
# for rotation-guard refusals of retired-key manifests.
verifiableCompliance:
  enabled: true

# -- Lens Telemetry Backend (v3.5.0+ Phase 3)
# Accepts anonymized threat telemetry from the AegisGate Lens browser
# extension. When enabled, the Lens FP-report bridge endpoint is
# mounted at /api/v1/lens/fp-report on the proxy mux.
# Professional+ tier required.
lens:
  enabled: false
  # bearerToken: ""  # AEGISGATE_LENS_BEARER_TOKEN — required for all endpoints except /healthz
  # iocStoreDir: ""  # AEGISGATE_LENS_IOC_STORE_DIR — empty = in-memory

# -- SIEM Dispatcher (v3.5.0+ Phase 4 / D15)
# Forwards audit events from the ring buffer to external SIEM platforms.
# Professional+ tier required.
siem:
  enabled: false
  source: "aegisgate"
  pollInterval: 5s
  batchSize: 100
  bufferMaxSize: 10000
  platforms: []
  # Example platform configuration:
  # platforms:
  #   - platform: splunk
  #     enabled: true
  #     format: cef
  #     endpoint: "https://splunk.example.com:8088/services/collector"
  #     auth:
  #       type: api_key
  #       api_key: ""  # AEGISGATE_SIEM_API_KEY
  #     retry:
  #       enabled: true
  #       max_attempts: 3
  #       initial_backoff: "1s"
  #       max_backoff: "30s"
  #       backoff_multiplier: 2.0
  #     batch:
  #       enabled: true
  #       max_size: 100
  #       max_wait: "5s"

# -- Extra CLI arguments passed to the binary
extraArgs: []
  # - "--log-level=debug"
  # - "--config=/data/config.yaml"

# -- Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# -- Pod annotations (useful for vault/inject sidecars, etc.)
podAnnotations: {}

# -- Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1