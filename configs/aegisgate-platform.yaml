# AegisGate Security Platform Configuration
server:
  host: "0.0.0.0"
  proxy_port: 8080
  mcp_port: 8081
  dashboard_port: 8443
tier: community
scanner:
  address: "localhost:8081"
  timeout: 30s
bridge:
  enabled: true
  aegisgate_url: "http://localhost:8080"
  timeout: 30s
a2a:
  enabled: true
  config_file: "configs/a2a.yaml"
  caps_file: "configs/a2a_caps.yaml"
acp:
  enabled: true
  config_file: "configs/acp.yaml"
logging:
  level: info
  format: json
redis:
  url: "redis://localhost:6379"

# Lens telemetry backend (Professional+ tier)
# Accepts anonymized threat telemetry from AegisGate Lens browser extension.
# Enable with --lens-enabled or AEGISGATE_LENS_ENABLED=true.
lens:
  enabled: false
  bearer_token: ""        # AEGISGATE_LENS_BEARER_TOKEN
  ioc_store_dir: ""      # AEGISGATE_LENS_IOC_STORE_DIR (empty = in-memory)

# SIEM dispatcher (Professional+ tier)
# Forwards audit events to external SIEM platforms.
# Enable with --siem-enabled or AEGISGATE_SIEM_ENABLED=true.
siem:
  enabled: false
  source: "aegisgate"     # AEGISGATE_SIEM_SOURCE
  poll_interval: 5s
  batch_size: 100
  buffer_max_size: 10000
  platforms: []           # Add SIEM platform configs (see pkg/platformconfig/config.go)