# SPDX-License-Identifier: Apache-2.0
# AegisGate Platform — ML Detection Gate CI Workflow
#
# Tests the L3 ML/ONNX detection layer against adversarial payloads.
# This is separate from the L1 detection gate (detection-gate.yml) because
# it requires onnxruntime and the ONNX model file, which are not available
# in the standard CI build (CGO_ENABLED=0 community edition).
#
# The ML model is downloaded from the latest GitHub release.
# onnxruntime is installed from the official Microsoft package repository.
#
# Trigger: On PRs and pushes to main that touch ML-related files.
# Manual trigger available.

name: ML Detection Gate

on:
  push:
    branches: [main]
    paths:
      - 'pkg/ml/**'
      - 'pkg/scanner/**'
      - 'tests/adversarial/**'
      - 'upstream/aegisgate/pkg/scanner/**'
      - 'upstream/aegisgate/pkg/compliance/**'
      - 'upstream/aegisgate/pkg/proxy/**'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/ml/**'
      - 'pkg/scanner/**'
      - 'tests/adversarial/**'
      - 'upstream/aegisgate/pkg/scanner/**'
      - 'upstream/aegisgate/pkg/compliance/**'
      - 'upstream/aegisgate/pkg/proxy/**'
  workflow_dispatch:
  schedule:
    # Weekly ML detection audit — every Monday at 10:00 UTC (after L1 gate)
    - cron: '0 10 * * 1'

env:
  GO_VERSION: '1.26.6'

permissions:
  contents: read
  issues: write

jobs:
  ml-detection-gate:
    name: ML Detection Rate Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install onnxruntime
        run: |
          # onnxruntime_go v1.36.0 requires C API version 29 (ORT 1.29.0)
          # Using older versions causes "Error setting ORT API base: 2"
          ORT_VERSION="1.29.0"
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C /tmp/
          sudo cp /tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so* /usr/lib/
          sudo ldconfig
          echo "ONNXRUNTIME_SHARED_LIBRARY_PATH=/usr/lib/libonnxruntime.so" >> $GITHUB_ENV
          # Verify installation
          python3 -c "import ctypes; ctypes.CDLL('/usr/lib/libonnxruntime.so'); print('onnxruntime loaded')" || true

      - name: Download ML model from latest release
        run: |
          mkdir -p pkg/ml/models
          mkdir -p upstream/aegisgate/pkg/ml/models
          # Download the ONNX model from the latest GitHub release
          gh release download --pattern "threat_cnn_bilstm.onnx" --dir pkg/ml/models/ || {
            echo "Model not found in release assets — using heuristic-only mode"
            echo "AEGISGATE_ML_SKIP=1" >> $GITHUB_ENV
          }
          # Verify model hash
          if [ -f pkg/ml/models/threat_cnn_bilstm.onnx ]; then
            MODEL_HASH=$(sha256sum pkg/ml/models/threat_cnn_bilstm.onnx | cut -d' ' -f1)
            echo "Model downloaded. SHA256: $MODEL_HASH"
            echo "Expected: 9ce1e81a5ec68733f6dc763815203e8f42a3116f41c3642dfbf199f7849d2822"
            if [ "$MODEL_HASH" != "9ce1e81a5ec68733f6dc763815203e8f42a3116f41c3642dfbf199f7849d2822" ]; then
              echo "WARNING: Model hash mismatch! Expected v12 model."
            fi
          else
            echo "ERROR: Model file not found after download"
            echo "AEGISGATE_ML_SKIP=1" >> $GITHUB_ENV
          fi
          # Copy model to upstream/aegisgate/pkg/ml/models/ for evasion suite
          # (evasion suite runs from upstream/aegisgate/ directory)
          cp pkg/ml/models/threat_cnn_bilstm.onnx upstream/aegisgate/pkg/ml/models/ 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build platform binary (with CGO for ONNX)
        if: env.AEGISGATE_ML_SKIP != '1'
        env:
          CGO_ENABLED: '1'
        run: |
          go clean -cache
          go build -o aegisgate-platform ./cmd/aegisgate-platform

      - name: Build echo server
        run: |
          go build -o echo-server ./tests/echo-server/

      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz | tar -xz
          sudo mv k6-v0.57.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Generate k6 payloads from corpus
        run: |
          go run ./scripts/generate-k6-payloads/
          git diff --exit-code tests/load/k6/payloads.js && echo "Payloads in sync" || {
            echo "ERROR: payloads.js is out of sync with corpus.yaml"
            exit 1
          }

      - name: Start echo server
        run: |
          ./echo-server -port 11435 &
          echo $! > /tmp/echo-server.pid
          sleep 2
          curl -s http://localhost:11435/health | grep -q healthy

      - name: Start platform (staging mode, with ML)
        if: env.AEGISGATE_ML_SKIP != '1'
        env:
          AEGISGATE_DATA_DIR: /tmp/aegisgate-data
          API_AUTH_TOKEN: ci-test-token
          AEGISGATE_ML_MODEL_PATH: ${{ github.workspace }}/pkg/ml/models/threat_cnn_bilstm.onnx
          ONNXRUNTIME_SHARED_LIBRARY_PATH: /usr/lib/libonnxruntime.so
        run: |
          mkdir -p /tmp/aegisgate-data
          ./aegisgate-platform \
            --proxy-port=8080 \
            --dashboard-port=8443 \
            --mcp-port=8081 \
            --embedded-mcp \
            --mode=staging \
            --target=http://localhost:11435 \
            > /tmp/platform.log 2>&1 &
          echo $! > /tmp/platform.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Platform is healthy"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8080/health
          # Verify ML model is loaded
          grep -q "ML model" /tmp/platform.log && echo "ML model loaded" || echo "WARNING: ML model not loaded — check logs"

      - name: Run ML detection gate test
        if: env.AEGISGATE_ML_SKIP != '1'
        env:
          PROXY_URL: 'http://localhost:8080/v1/chat/completions'
          AUTH_TOKEN: 'ci-test-token'
        run: |
          k6 run --quiet tests/load/k6/detection-gate.js 2>&1 | tee /tmp/ml-detection-results.txt
          if grep -q "❌ FAIL" /tmp/ml-detection-results.txt; then
            echo "ML DETECTION GATE FAILED"
            exit 1
          fi
          echo "ML DETECTION GATE PASSED"

      - name: Run evasion suite (ML layer)
        if: env.AEGISGATE_ML_SKIP != '1'
        env:
          AEGISGATE_ML_MODEL_PATH: ${{ github.workspace }}/upstream/aegisgate/pkg/ml/models/threat_cnn_bilstm.onnx
          ONNXRUNTIME_SHARED_LIBRARY_PATH: /usr/lib/libonnxruntime.so
          CGO_ENABLED: '1'
        run: |
          cd upstream/aegisgate
          go clean -cache
          go test -v -run TestEvasionSuite -timeout 10m ./pkg/proxy/ 2>&1 | tee /tmp/evasion-results.txt
          # Check evasion resistance score (must be >= 95.0)
          # With ORT 1.29.0 + ONNX neural detector, score is 99.3/100.
          # Heuristic-only mode (no ONNX) scores ~88.7/100.
          SCORE=$(grep "Evasion Resistance Score" /tmp/evasion-results.txt | grep -oP '[\d.]+/100' | cut -d/ -f1)
          echo "Evasion Resistance Score: $SCORE/100"
          if awk -v score="$SCORE" 'BEGIN { exit !(score < 95.0) }'; then
            echo "EVASION RESISTANCE BELOW THRESHOLD (95.0)"
            exit 1
          fi

      - name: Weekly audit — create issue on ML regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('/tmp/ml-detection-results.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Weekly ML Detection Audit: Regression Detected',
              body: `The weekly ML detection audit has detected a regression.\n\n\`\`\`\n${results}\n\`\`\`\n\nPlease investigate and fix before the next release.\n\nTriggered by: scheduled audit (Monday 10:00 UTC)`,
              labels: ['ml-regression', 'priority:high']
            });

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/platform.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/echo-server.pid 2>/dev/null) 2>/dev/null || true

      - name: Upload ML detection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-detection-gate-results
          path: |
            /tmp/ml-detection-results.txt
            /tmp/evasion-results.txt
          retention-days: 30
