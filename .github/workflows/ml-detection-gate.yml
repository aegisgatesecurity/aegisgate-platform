# SPDX-License-Identifier: Apache-2.0
# AegisGate Platform — ML Detection Gate CI Workflow
#
# WITHDRAWN 2026-11-23
# ===================
# Neural ML detection was withdrawn: the CharCNN-BiLSTM model (v22b and
# predecessors) was trained on a corpus whose attack-side labels were ~71%
# incorrect, and every ML path is now hard-disabled in code. This workflow
# previously downloaded the model from a GitHub release and ran it, which
# would re-arm a withdrawn artifact — so it is replaced by this stub.
#
# This file is intentionally kept (not deleted) so the gate can be restored
# once a retrained, re-audited model passes a new baseline. Recovery path:
#   1. Retrain on the re-audited corpus (see corpus-certification-2026-11-23)
#   2. Re-run the evasion suite and detection gate locally
#   3. Restore this workflow from git history (pre-withdrawal commit)
#   4. Re-enable only after docs/ML-WITHDRAWN.md is lifted
#
# See docs/ML-WITHDRAWN.md for the full withdrawal notice.

name: ML Detection Gate (withdrawn)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-detection-gate:
    name: ML Detection Gate — WITHDRAWN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ML detection withdrawn
        run: |
          echo "Neural ML detection is WITHDRAWN (2026-11-23)."
          echo "No model is downloaded; no ML gate is run."
          echo "See docs/ML-WITHDRAWN.md for the withdrawal notice."
          exit 0
