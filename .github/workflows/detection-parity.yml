# SPDX-License-Identifier: Apache-2.0
# AegisGate Platform — Triple Detection Parity CI Workflow
#
# Checks out all three repos (Platform, Lens, Rampart) and compares:
#   1. Scanner pattern names (regex layer)
#   2. Regex content for shared patterns
#   3. Model hash alignment (ONNX v13)
#   4. Evasion suite payload count (81)
#   5. Transform count (50)
#   6. ML threshold alignment (0.5)
#   7. Detection logic check (regex + ML, not ML-only)
#
# Fails if any hard gate fails. Warns on soft divergences.
#
# Trigger: On PRs and pushes that touch detection-related files.

name: Detection Parity

on:
  push:
    branches: [main]
    paths:
      - 'pkg/scanner/patterns.go'
      - 'pkg/ml/detector.go'
      - 'pkg/ml/types.go'
      - 'upstream/aegisgate/pkg/proxy/evasion_suite_test.go'
      - 'upstream/aegisgate/pkg/scanner/normalize.go'
      - 'upstream/aegisgate/pkg/scanner/normalize_conformance_test.go'
      - 'testkit/normalization-conformance-vectors.json'
      - 'testkit/normalization-spec.json'
      - 'scripts/check-normalization-conformance.sh'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/scanner/patterns.go'
      - 'pkg/ml/detector.go'
      - 'pkg/ml/types.go'
      - 'upstream/aegisgate/pkg/proxy/evasion_suite_test.go'
      - 'upstream/aegisgate/pkg/scanner/normalize.go'
      - 'upstream/aegisgate/pkg/scanner/normalize_conformance_test.go'
      - 'testkit/normalization-conformance-vectors.json'
      - 'testkit/normalization-spec.json'
      - 'scripts/check-normalization-conformance.sh'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Weekly — same as detection gate

permissions:
  contents: read
  issues: write

jobs:
  parity-check:
    name: Triple Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Platform
        uses: actions/checkout@v6
        with:
          path: aegisgate-platform

      - name: Checkout Lens
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-lens
          path: aegisgate-lens
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Rampart
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-rampart
          path: aegisgate-rampart
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run parity check
        run: |
          cd aegisgate-platform
          PLATFORM_DIR=$GITHUB_WORKSPACE/aegisgate-platform \
          LENS_DIR=$GITHUB_WORKSPACE/aegisgate-lens \
          RAMPART_DIR=$GITHUB_WORKSPACE/aegisgate-rampart \
          bash scripts/check-detection-parity.sh

      - name: Run normalization conformance check
        run: |
          cd aegisgate-platform
          PLATFORM_DIR=$GITHUB_WORKSPACE/aegisgate-platform \
          LENS_DIR=$GITHUB_WORKSPACE/aegisgate-lens \
          RAMPART_DIR=$GITHUB_WORKSPACE/aegisgate-rampart \
          AEGISGATE_ROOT=$GITHUB_WORKSPACE \
          bash scripts/check-normalization-conformance.sh

      - name: Create issue on parity failure (weekly audit)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Detection Parity Drift Detected',
              body: 'The weekly parity check detected that detection patterns have drifted between Platform, Lens, and Rampart.\n\nPlease sync the missing patterns to the affected product(s).\n\nTriggered by: scheduled audit (Monday 09:00 UTC)',
              labels: ['parity-drift', 'priority:high']
            });