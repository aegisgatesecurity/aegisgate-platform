# CI Workflow for AegisGate Platform
# Validates code quality, security, and DCO compliance

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  GO_VERSION: '1.27.3'

permissions:
  contents: read
  packages: write

# Ensure pipeline failures propagate (GitHub Actions default shell omits
# pipefail on some runners, causing `go test | tee` to swallow test
# failures). This explicitly sets the shell to include -o pipefail.
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout Scanner (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-scanner
          path: ./aegisgate-scanner
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update go.mod replace for scanner
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-scanner=./aegisgate-scanner -replace github.com/aegisgatesecurity/aegisgate-platform=.

      - name: Verify Signed-off-by on all commits
        run: |
          echo "## DCO Verification" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          BOT_COMMITS=0
          # For PRs: check all commits between base and head (strict enforcement)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%H" origin/${{ github.base_ref }}..HEAD)
            STRICT=1
          else
            # For pushes/schedule: check the latest commit (advisory only)
            COMMITS=$(git log --format="%H" -1)
            STRICT=0
          fi
          for COMMIT in $COMMITS; do
            AUTHOR=$(git log --format="%an" -1 $COMMIT)
            # Exempt bot authors (dependabot, renovate, etc.) from DCO
            EMAIL=$(git log --format="%ae" -1 $COMMIT)
            if echo $AUTHOR | grep -qiE '(dependabot|renovate|github-actions)[bot]$|bot$' || echo $EMAIL | grep -qiE '(dependabot|renovate|github-actions)[bot]|bot@|[bot]'; then
              SUBJECT=$(git log --format="%s" -1 $COMMIT)
              echo "⏭️ Skipping DCO for bot commit: $SUBJECT ($AUTHOR)" >> $GITHUB_STEP_SUMMARY
              BOT_COMMITS=$((BOT_COMMITS + 1))
              continue
            fi
            # Exempt merge commits (commits with 2+ parents - created by GitHub merge UI)
            PARENT_COUNT=$(git rev-list --parents -1 $COMMIT | awk '{print NF}') || true
            if [ "$PARENT_COUNT" -gt 2 ]; then
              SUBJECT=$(git log --format="%s" -1 $COMMIT)
              echo "⏭️ Skipping DCO for merge commit: $SUBJECT ($AUTHOR)" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            SIGNOFF=$(git log --format="%B" -1 $COMMIT | grep -c "Signed-off-by:" || true)
            if [ "$SIGNOFF" -eq 0 ]; then
              EMAIL=$(git log --format="%ae" -1 $COMMIT)
              SUBJECT=$(git log --format="%s" -1 $COMMIT)
              echo "❌ Missing Signed-off-by: $SUBJECT ($AUTHOR <$EMAIL>)" >> $GITHUB_STEP_SUMMARY
              echo "   Fix: git commit --amend -s" >> $GITHUB_STEP_SUMMARY
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See [DCO.md](DCO.md) for instructions on signing your commits." >> $GITHUB_STEP_SUMMARY
            if [ "$STRICT" -eq 1 ]; then
              echo "❌ DCO check failed — all PR commits must include Signed-off-by"
              exit 1
            else
              echo "⚠️ DCO advisory: commits without Signed-off-by detected"
            fi
          else
            if [ "$BOT_COMMITS" -gt 0 ]; then
              echo "✅ All human commits have Signed-off-by; $BOT_COMMITS bot commit(s) exempted" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ All commits have valid Signed-off-by lines" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  test:
    name: Test Suite
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Checkout Scanner (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-scanner
          path: ./aegisgate-scanner
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go.mod replace for CI
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-scanner=./aegisgate-scanner -replace github.com/aegisgatesecurity/aegisgate-platform=.

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        # CGO_ENABLED=0 excludes //go:build cgo test files (ML/ONNX tests)
        # that require the onnxruntime shared library. ML detection is
        # validated separately by ml-detection-gate.yml which installs
        # onnxruntime. This prevents silent ML test failures in regular CI.
        env:
          CGO_ENABLED: 0
        run: |
          # Exclude packages that require external services (Stripe, SMTP)
          # and stub packages from coverage calculation
          go test -coverprofile=coverage.out \
            $(go list ./pkg/... | grep -v "/compliance" | grep -v "/upstream/" | grep -v "/billing" | grep -v "/email" | grep -v "/stores") \
            2>&1 | tee test-results.txt

      - name: Run race detector
        # Verifies all packages are race-free. CGO_ENABLED=1 is required
        # for the race detector. pkg/ml is excluded because its ONNX
        # efficacy tests require the model file (gitignored, not in CI)
        # and would fail unrelated to race conditions. pkg/assessment's
        # cgo test skips gracefully when the model is absent.
        env:
          CGO_ENABLED: 1
        run: |
          go test -race -count=1 \
            $(go list ./pkg/... | grep -v "/compliance" | grep -v "/upstream/" | grep -v "/billing" | grep -v "/email" | grep -v "/stores" | grep -v "/ml" | grep -v "/assessment") \
            2>&1 | tee race-results.txt
          echo "✅ All packages pass race detector"

      - name: Run per-package integration tests with coverage
        # Runs testcontainer-based integration tests for packages that
        # require a running PostgreSQL instance. -p 1 serializes package
        # execution to avoid Docker container resource contention when
        # many packages create containers simultaneously.
        # CGO_ENABLED=0 for consistency with unit tests.
        env:
          CGO_ENABLED: 0
        run: |
          # Packages with testcontainer integration tests (//go:build integration).
          # These packages have unit-only coverage below 90% but reach 90%+
          # when integration tests are included.
          INTEGRATION_PACKAGES=(
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/attestation"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/cluster"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/correlation"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/incident"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/ioc"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/legalhold"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/license"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/persistence"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/rbac"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/sso"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/tenant"
          )
          # -p 1 serializes package execution (one testcontainer at a time).
          # -count=1 disables caching.
          go test -tags=integration -p 1 -count=1 -cover \
            "${INTEGRATION_PACKAGES[@]}" \
            2>&1 | tee integration-results.txt

      - name: Run integration tests
        # End-to-end integration tests (not per-package coverage).
        run: |
          go test -tags=integration -v -p 1 ./tests/integration/... 2>&1 | tee -a test-results.txt

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Check coverage threshold (85% minimum)
        # Total coverage across all CI-scoped packages (unit-only).
        # The CI-scoped unit-only total is ~86.5%. The 85% threshold
        # provides headroom for minor fluctuations while ensuring
        # overall coverage remains high.
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 85" | bc -l) )); then
            echo "❌ Coverage below 85% (required threshold)"
            exit 1
          else
            echo "✅ Coverage meets 85% threshold"
          fi

      - name: Check per-package coverage floor (90% minimum, with exemptions)
        # Per-package coverage floor. Catches the case where one
        # package tanks the average or where coverage is concentrated
        # in a few packages.
        #
        # Packages with testcontainer integration tests are checked
        # at 90% from integration-results.txt (which includes both
        # unit and integration coverage). All other packages are
        # checked at 90% from test-results.txt (unit-only).
        #
        # Exempted packages are listed below with a justification.
        # Each exemption must be reviewed and documented.
        run: |
          EXEMPTED_PACKAGES=(
            # cmd/aegisgate-platform: the 64KB main.go contains
            # process-composition code (flag parsing, signal handling,
            # server lifecycle) that is genuinely hard to test
            # without a process-level harness. The IOC admin API and
            # wiring code within this package IS tested (see
            # ioc_admin_api_test.go and ioc_wiring_test.go). Exempted
            # for now; can be revisited in a future session.
            "github.com/aegisgatesecurity/aegisgate-platform/cmd/aegisgate-platform"
            # pkg (root): contains only doc.go, no statements to cover.
            "github.com/aegisgatesecurity/aegisgate-platform/pkg"
            # pkg/testdb: 0% coverage. Ephemeral PostgreSQL test helper using
            # testcontainers-go. Requires a running Docker daemon. Cannot be
            # unit-tested without external infrastructure. Exempted; this is
            # test infrastructure, not production code.
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/testdb"
            # pkg/ml: 89.2% in CI. ML efficacy tests require the ONNX model
            # file (gitignored, not in CI). CI runs with heuristic fallback,
            # skipping ONNX-specific code paths. ML detection is validated
            # separately by ml-detection-gate.yml which installs onnxruntime.
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/ml"
          )
          # Packages checked from integration-results.txt (they have
          # testcontainer integration tests that bring them to 90%+).
          # These are exempted from the unit-only floor and checked
          # separately from the integration results.
          INTEGRATION_PACKAGES=(
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/attestation"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/cluster"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/correlation"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/incident"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/ioc"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/legalhold"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/license"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/persistence"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/rbac"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/sso"
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/tenant"
          )
          FAIL=0
          echo "## Per-Package Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage | Source | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # Helper: check if a package is in a list
          in_list() {
            local pkg="$1"
            shift
            for item in "$@"; do
              if [ "$pkg" = "$item" ]; then return 0; fi
            done
            return 1
          }

          # Parse unit test results (test-results.txt) for non-integration packages.
          while IFS= read -r LINE; do
            PKG=$(echo "$LINE" | awk '{print $2}')
            # || true prevents set -e from killing the script when grep
            # finds no match (e.g., "coverage: [no statements]" lines).
            COV=$(echo "$LINE" | grep -oE 'coverage: [0-9.]+%' | awk '{print $2}' | tr -d '%') || true
            if [ -z "$PKG" ] || [ -z "$COV" ]; then
              continue
            fi
            # Skip integration packages (checked from integration-results.txt).
            if in_list "$PKG" "${INTEGRATION_PACKAGES[@]}"; then
              continue
            fi
            STATUS="✅"
            EXEMPT=0
            for EX in "${EXEMPTED_PACKAGES[@]}"; do
              if [ "$PKG" = "$EX" ]; then
                EXEMPT=1
                STATUS="⏭️ (exempt)"
                break
              fi
            done
            UNDER=$(awk "BEGIN { print ($COV < 90) ? 1 : 0 }")
            if [ "$EXEMPT" = "0" ] && [ "$UNDER" = "1" ]; then
              STATUS="❌"
              FAIL=1
            fi
            echo "| $PKG | $COV% | unit | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done < <(grep -E "^ok " test-results.txt | grep "coverage:")

          # Parse integration test results (integration-results.txt) for integration packages.
          if [ -f integration-results.txt ]; then
            while IFS= read -r LINE; do
              PKG=$(echo "$LINE" | awk '{print $2}')
              # || true prevents set -e from killing the script when grep
              # finds no match (e.g., "coverage: [no statements]" lines).
              COV=$(echo "$LINE" | grep -oE 'coverage: [0-9.]+%' | awk '{print $2}' | tr -d '%') || true
              if [ -z "$PKG" ] || [ -z "$COV" ]; then
                continue
              fi
              # Only check packages in the integration list.
              if ! in_list "$PKG" "${INTEGRATION_PACKAGES[@]}"; then
                continue
              fi
              STATUS="✅"
              UNDER=$(awk "BEGIN { print ($COV < 90) ? 1 : 0 }")
              if [ "$UNDER" = "1" ]; then
                STATUS="❌"
                FAIL=1
              fi
              echo "| $PKG | $COV% | integration | $STATUS |" >> $GITHUB_STEP_SUMMARY
            done < <(grep -E "^ok " integration-results.txt | grep "coverage:")
          else
            echo "⚠️ integration-results.txt not found — integration packages not checked" >> $GITHUB_STEP_SUMMARY
            FAIL=1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $FAIL -eq 1 ]; then
            echo "❌ One or more packages are below the 90% per-package floor"
            exit 1
          else
            echo "✅ All packages meet 90% per-package floor"
          fi

      - name: Check package doc.go files (every package must have one)
        run: |
          # Verifies that every package under pkg/ has a valid doc.go
          # file with the SPDX-License-Identifier header. This is the
          # "26/45 packages lack doc.go" guard from
          # plans/PLATFORM-DEEP-DIVE-ASSESSMENT-2026-07-21.md.
          echo "## Package doc.go Check" >> $GITHUB_STEP_SUMMARY
          chmod +x ./scripts/check-doc-go.sh
          if ./scripts/check-doc-go.sh 2>&1 | tee doc-go-results.txt; then
            echo "✅ All packages have valid doc.go files" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ doc.go check failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Compliance regression gate
        run: |
          echo "## Compliance Regression Gate" >> $GITHUB_STEP_SUMMARY
          # Run compliance regression tests (baseline comparison, audit trail)
          go test ./pkg/compliance/ -run "TestRegression|TestCompare|TestCheckInCI|TestSnapshotBaseline|TestLoadBaseline|TestExportBaseline|TestDefaultRegression" \
            -count=1 -v 2>&1 | tee compliance-regression-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Compliance regression gate failed" >> $GITHUB_STEP_SUMMARY
            echo "   One or more compliance regression tests failed." >> $GITHUB_STEP_SUMMARY
            echo "   This may indicate a pattern or score regression." >> $GITHUB_STEP_SUMMARY
            echo "   If intentional, update the baseline and re-commit." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No compliance regressions detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.txt
            integration-results.txt
            coverage.html
            coverage.txt
            coverage.out
            doc-go-results.txt
            compliance-regression-results.txt

  govulncheck:
    name: govulncheck
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Checkout Scanner (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-scanner
          path: ./aegisgate-scanner
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go.mod replace for CI
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-scanner=./aegisgate-scanner -replace github.com/aegisgatesecurity/aegisgate-platform=.

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          echo "## govulncheck Results" >> $GITHUB_STEP_SUMMARY
          govulncheck ./... 2>&1 | tee govulncheck-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "⚠️ Vulnerabilities found - see results" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No Go vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload govulncheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-results
          path: govulncheck-results.txt
          retention-days: 30

  docker-push:
    name: Docker Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/aegisgate-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Scanner (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-scanner
          path: ./aegisgate-scanner
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go.mod replace for CI
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-scanner=./aegisgate-scanner -replace github.com/aegisgatesecurity/aegisgate-platform=.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
            type=match,pattern=v(.*),group=1,value=${{ github.ref_name }}

      - name: Extract version for ldflags
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-push:
    name: Push Helm Chart to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push Helm chart
        run: |
          helm package deploy/helm/aegisgate-platform
          helm push aegisgate-platform-*.tgz oci://ghcr.io/${{ github.repository_owner }}

  lint:
    name: Lint (golangci-lint)
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Checkout Scanner (for go.mod replace)
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-scanner
          path: ./aegisgate-scanner
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go.mod replace for CI
        run: go mod edit -replace github.com/aegisgatesecurity/aegisgate-scanner=./aegisgate-scanner -replace github.com/aegisgatesecurity/aegisgate-platform=.

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./... 2>&1 | tee lint-results.txt

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: lint-results.txt
          retention-days: 30

      - name: Fail on lint errors
        run: |
          # Check for actual issues (not "0 issues."). The "Run golangci-lint"
          # step already exits non-zero on findings via pipefail; this is a
          # belt-and-suspenders check that parses the summary line.
          if grep -qE "[1-9][0-9]* issues" lint-results.txt 2>/dev/null; then
            echo "⚠️ Linting issues found - see results"
            exit 1
          fi
