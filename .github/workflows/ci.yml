# CI Workflow for AegisGate Platform
# Validates code quality, security, and DCO compliance

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  GO_VERSION: '1.26.4'

permissions:
  contents: read
  packages: write

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        run: |
          echo "## DCO Verification" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          BOT_COMMITS=0
          # For PRs: check all commits between base and head (strict enforcement)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%H" origin/${{ github.base_ref }}..HEAD)
            STRICT=1
          else
            # For pushes/schedule: check the latest commit (advisory only)
            COMMITS=$(git log --format="%H" -1)
            STRICT=0
          fi
          for COMMIT in $COMMITS; do
            AUTHOR=$(git log --format="%an" -1 $COMMIT)
            # Exempt bot authors (dependabot, renovate, etc.) from DCO
            EMAIL=$(git log --format="%ae" -1 $COMMIT)
            if echo $AUTHOR | grep -qiE '(dependabot|renovate|github-actions)[bot]$|bot$' || echo $EMAIL | grep -qiE '(dependabot|renovate|github-actions)[bot]|bot@|[bot]'; then
              SUBJECT=$(git log --format="%s" -1 $COMMIT)
              echo "⏭️ Skipping DCO for bot commit: $SUBJECT ($AUTHOR)" >> $GITHUB_STEP_SUMMARY
              BOT_COMMITS=$((BOT_COMMITS + 1))
              continue
            fi
            # Exempt merge commits (commits with 2+ parents - created by GitHub merge UI)
            PARENT_COUNT=$(git rev-list --parents -1 $COMMIT | awk '{print NF}') || true
            if [ "$PARENT_COUNT" -gt 2 ]; then
              SUBJECT=$(git log --format="%s" -1 $COMMIT)
              echo "⏭️ Skipping DCO for merge commit: $SUBJECT ($AUTHOR)" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            SIGNOFF=$(git log --format="%B" -1 $COMMIT | grep -c "Signed-off-by:" || true)
            if [ "$SIGNOFF" -eq 0 ]; then
              EMAIL=$(git log --format="%ae" -1 $COMMIT)
              SUBJECT=$(git log --format="%s" -1 $COMMIT)
              echo "❌ Missing Signed-off-by: $SUBJECT ($AUTHOR <$EMAIL>)" >> $GITHUB_STEP_SUMMARY
              echo "   Fix: git commit --amend -s" >> $GITHUB_STEP_SUMMARY
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See [DCO.md](DCO.md) for instructions on signing your commits." >> $GITHUB_STEP_SUMMARY
            if [ "$STRICT" -eq 1 ]; then
              echo "❌ DCO check failed — all PR commits must include Signed-off-by"
              exit 1
            else
              echo "⚠️ DCO advisory: commits without Signed-off-by detected"
            fi
          else
            if [ "$BOT_COMMITS" -gt 0 ]; then
              echo "✅ All human commits have Signed-off-by; $BOT_COMMITS bot commit(s) exempted" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ All commits have valid Signed-off-by lines" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  test:
    name: Test Suite
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          # Exclude packages that require external services (Stripe, SMTP)
          # and stub packages from coverage calculation
          go test -coverprofile=coverage.out \
            $(go list ./pkg/... | grep -v "/compliance" | grep -v "/upstream/" | grep -v "/billing" | grep -v "/email" | grep -v "/stores") \
            2>&1 | tee test-results.txt

      - name: Run integration tests
        run: |
          go test -tags=integration -v ./tests/integration/... 2>&1 | tee -a test-results.txt

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Check coverage threshold (80% minimum)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage below 80% (required threshold)"
            exit 1
          else
            echo "✅ Coverage meets 80% threshold"
          fi

      - name: Check per-package coverage floor (80% minimum, with exemptions)
        run: |
          # Per-package coverage floor. Catches the case where one
          # package tanks the average or where coverage is concentrated
          # in a few packages.
          #
          # Exempted packages are listed below with a justification.
          # Each exemption must be reviewed and documented.
          EXEMPTED_PACKAGES=(
            # cmd/aegisgate-platform: the 64KB main.go contains
            # process-composition code (flag parsing, signal handling,
            # server lifecycle) that is genuinely hard to test
            # without a process-level harness. The IOC admin API and
            # wiring code within this package IS tested (see
            # ioc_admin_api_test.go and ioc_wiring_test.go). Exempted
            # for now; can be revisited in a future session.
            "github.com/aegisgatesecurity/aegisgate-platform/cmd/aegisgate-platform"
            # pkg/reporting: a thin 122-LOC wrapper around the
            # vendored upstream pkg/reporting. The wrapper adds
            # PDF rendering (delegates to pkg/pdf) and a platform-
            # side Reporter constructor. NewReporter (75%) and
            # ExportPDF (55.6%) error paths are tested; ExportPDFAdHoc
            # (100%) is the happy-path smoke test. The full happy
            # path of ExportPDF (completed report -> PDF) requires
            # running the upstream reporter's scheduler, which is
            # a process-level test. Exempted; can be revisited if
            # the upstream reporter gains a public injection API.
            "github.com/aegisgatesecurity/aegisgate-platform/pkg/reporting"
            # pkg (root): contains only doc.go, no statements to cover.
            "github.com/aegisgatesecurity/aegisgate-platform/pkg"
          )
          FAIL=0
          echo "## Per-Package Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          # Parse test-results.txt for per-package coverage lines.
          # Format: ok <import-path> <time> coverage: XX.X% of statements
          # (or: "coverage: [no statements]" for doc-only packages)
          while IFS= read -r LINE; do
            # Extract import path and coverage percentage.
            PKG=$(echo "$LINE" | awk '{print $2}')
            COV=$(echo "$LINE" | grep -oE 'coverage: [0-9.]+%' | awk '{print $2}' | tr -d '%')
            if [ -z "$PKG" ] || [ -z "$COV" ]; then
              continue  # skip lines with no coverage (e.g. [no statements])
            fi
            STATUS="✅"
            # Check exemption list.
            EXEMPT=0
            for EX in "${EXEMPTED_PACKAGES[@]}"; do
              if [ "$PKG" = "$EX" ]; then
                EXEMPT=1
                STATUS="⏭️ (exempt)"
                break
              fi
            done
            # Compare using awk for floating point.
            UNDER=$(awk "BEGIN { print ($COV < 80) ? 1 : 0 }")
            if [ "$EXEMPT" = "0" ] && [ "$UNDER" = "1" ]; then
              STATUS="❌"
              FAIL=1
            fi
            echo "| $PKG | $COV% | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done < <(grep -E "^ok " test-results.txt | grep "coverage:")
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $FAIL -eq 1 ]; then
            echo "❌ One or more packages are below the 80% per-package floor"
            exit 1
          else
            echo "✅ All packages meet 80% per-package floor (with documented exemptions)"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.txt
            coverage.html
            coverage.txt
            coverage.out

  govulncheck:
    name: govulncheck
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          echo "## govulncheck Results" >> $GITHUB_STEP_SUMMARY
          govulncheck ./... 2>&1 | tee govulncheck-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "⚠️ Vulnerabilities found - see results" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No Go vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload govulncheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-results
          path: govulncheck-results.txt
          retention-days: 30

  docker-push:
    name: Docker Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/aegisgate-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint (golangci-lint)
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./... 2>&1 | tee lint-results.txt

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: lint-results.txt
          retention-days: 30

      - name: Fail on lint errors
        run: |
          if grep -q "issues" lint-results.txt 2>/dev/null; then
            echo "⚠️ Linting issues found - see results"
            exit 1
          fi
