name: Release Lens (debug v6 - actions/attest-build-provenance)

"on":
  push:
    tags:
      - 'lens-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#lens-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Platform
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'

      - name: Checkout Lens
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-lens
          ref: ${{ steps.meta.outputs.tag }}
          path: lens-src

      - name: Build
        shell: bash
        run: |
          mkdir -p /tmp/lens-dist
          go run ./tools/build-lens-extension/ \
            --src lens-src/src \
            --dist /tmp/lens-dist \
            --version "0.0.0-test" \
            --commit "${{ github.sha }}"

      - name: Locate ZIP
        shell: bash
        run: |
          ZIP=$(find /tmp -maxdepth 2 -name 'aegisgate-lens-*.zip' -print -quit)
          mkdir -p /tmp/lens-artifacts
          cp "$ZIP" "/tmp/lens-artifacts/aegisgate-lens-test.zip"

      - name: Attest ZIP
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: /tmp/lens-artifacts/aegisgate-lens-test.zip
