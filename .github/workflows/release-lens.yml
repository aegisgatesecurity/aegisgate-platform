name: Release Lens debug v7

"on":
  push:
    tags:
      - 'lens-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - run: echo "step1 ok"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: README.md
