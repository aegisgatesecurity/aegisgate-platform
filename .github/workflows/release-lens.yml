# =========================================================================
# AegisGate Platform - Lens Release Workflow with SLSA Build Level 3
# =========================================================================
#
# Purpose
# -------
# Builds the AegisGate Lens browser extension ZIP and a Model bundle
# on a tagged release and publishes them as a GitHub Release with a
# signed SLSA Build Level 3 provenance attestation attached to each
# artifact.
#
# Trigger
# -------
# - Push of a tag matching `lens-v*` (e.g., `lens-v0.2.2`, `lens-v0.3.0`).
#   The Lens repo's release workflow should ALSO push the matching
#   tag here so this workflow runs in lock-step with the Lens release.
# - Manual dispatch with a `tag` input (for re-running a release).
#
# What this produces
# ------------------
# For a tag like `lens-v0.2.2`:
# - `aegisgate-lens-v0.2.2.zip`            - the extension (signed Ed25519)
# - `aegisgate-lens-v0.2.2.intoto.jsonl`   - SLSA provenance (in-toto
#                                            attestation, signed via
#                                            GitHub OIDC / Fulcio)
# - (Optional) `aegisgate-lens-v0.2.2.bundle` - the ML model bundle if
#                                            built (see the `build-bundle`
#                                            job).
#
# SLSA level
# -----------
# This workflow targets SLSA Build Level 3:
#   - Provenance: in-toto SLSA Provenance v0.2 (JSON), generated by
#     slsa-framework/slsa-github-generator (a SLSA L3+ builder).
#   - Hardened build platform: GitHub-hosted ephemeral runners
#     (ubuntu-latest, no caching of build state across runs).
#   - Provenance non-forgeable: signed with the workflow's OIDC
#     token; the build steps cannot modify the provenance after
#     generation.
# Reference: https://slsa.dev
#
# Permissions
# -----------
# - `contents: write`   - to create the GitHub Release.
# - `id-token: write`    - to obtain an OIDC token for Sigstore
#                          signing of the provenance.
# - `attestations: write` - to upload the provenance to the repo's
#                            GitHub Attestations store.
#
# Verification
# ------------
# Downstream users verify with `slsa-verifier`:
#   $ go install github.com/slsa-framework/slsa-verifier/cli/slsa-verifier@latest
#   $ slsa-verifier verify-artifact \
#       --provenance-path aegisgate-lens-v0.2.2.intoto.jsonl \
#       --source-uri github.com/aegisgatesecurity/aegisgate-platform \
#       --source-tag lens-v0.2.2 \
#       aegisgate-lens-v0.2.2.zip
# A passing verify confirms the ZIP was built from the tagged commit
# of aegisgatesecurity/aegisgate-platform by the canonical GitHub
# Actions workflow (this one).
#
# Day 18 first commit; subsequent commits may add bundle provenance,
# verification in CI, etc.
# =========================================================================

name: Release Lens with SLSA provenance

on:
  push:
    tags:
      - 'lens-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., lens-v0.2.2)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: '1.26.4'
  LENS_REPO: aegisgatesecurity/aegisgate-lens
  # The Lens repo's main branch is the canonical source; the SLSA
  # provenance attests to this commit + the Platform commit
  # (workflow_run_id) that built the artifact.
  LENS_BRANCH: main

jobs:
  # =====================================================================
  # JOB 1: Build the extension
  # ---------------------------------------------------------------------
  # Builds the Lens .zip from the Lens source checked out at the
  # tagged commit. The build is reproducible because:
  #   - The build runs on a fresh ubuntu-latest runner.
  #   - All inputs (commit, source URL, tool versions) are recorded
  #     in the workflow context.
  #   - The resulting artifact's SHA-256 is exposed to the
  #     provenance job below.
  # =====================================================================
  build:
    name: Build extension
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      zip_path: ${{ steps.zip.outputs.path }}
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Tag like "lens-v0.2.2" -> version "0.2.2"
          VERSION="${TAG#lens-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve tag outputs (alias for downstream)
        id: tag
        run: echo "tag=$(cat <<< "${{ steps.meta.outputs.tag }}")" >> "$GITHUB_OUTPUT"

      - name: Resolve version outputs (alias for downstream)
        id: version
        run: echo "version=$(cat <<< "${{ steps.meta.outputs.version }}")" >> "$GITHUB_OUTPUT"

      - name: Checkout Platform repo (the build tool)
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Checkout Lens source at the tagged commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LENS_REPO }}
          ref: ${{ steps.meta.outputs.tag }}
          # Workspace-internal subdirectory; GitHub Actions requires
          # the path to be INSIDE $GITHUB_WORKSPACE.
          path: lens-src

      - name: Build the Lens extension
        run: |
          mkdir -p /tmp/lens-dist
          go run ./tools/build-lens-extension/ \
            --src lens-src/src \
            --dist /tmp/lens-dist \
            --version "${{ steps.meta.outputs.version }}" \
            --commit "lens-src:${{ github.sha }}"

      - name: Locate the produced ZIP
        id: zip
        run: |
          # The build tool writes the ZIP to its default output path
          # (/tmp/aegisgate-lens-<version>.zip); locate it regardless
          # of the exact path the build tool used.
          ZIP=$(find /tmp -maxdepth 2 -name 'aegisgate-lens-*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "::error::Build tool did not produce a Lens .zip"
            exit 1
          fi
          # Move to a known path so the upload step is predictable.
          mkdir -p /tmp/lens-artifacts
          cp "$ZIP" /tmp/lens-artifacts/aegisgate-lens-${{ steps.meta.outputs.version }}.zip
          echo "path=/tmp/lens-artifacts/aegisgate-lens-${{ steps.meta.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256 of the ZIP for provenance
        id: hashes
        shell: bash
        run: |
          # The generic SLSA generator expects base64-encoded
          # "sha256sum" output. sha256sum outputs `<hash>   <name>`
          # per line; the generator parses both.
          HASHES=$(sha256sum /tmp/lens-artifacts/*.zip | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: lens-zip-${{ steps.meta.outputs.version }}
          path: /tmp/lens-artifacts/
          retention-days: 14
          if-no-files-found: error

  # =====================================================================
  # JOB 2: Generate SLSA provenance
  # ---------------------------------------------------------------------
  # Calls the official slsa-framework/slsa-github-generator reusable
  # workflow (v2.1.0) with the generic SLSA3 generator. The generator
  # uses GitHub's OIDC token to sign the provenance in the Sigstore
  # transparency log (Rekor), making the provenance non-forgeable.
  # =====================================================================
  provenance:
    name: Generate SLSA Build Level 3 provenance
    needs: build
    if: success()
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    permissions:
      actions: read
      id-token: write
      contents: read
      attestations: write
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      # Pin by full semver tag as required by slsa-verifier.
      # The generator itself signs with the workflow's OIDC token;
      # pinning the workflow ref proves the provenance came from
      # the official generator.

  # =====================================================================
  # JOB 3: Publish GitHub Release with provenance as assets
  # ---------------------------------------------------------------------
  # Creates (or updates) a GitHub Release for the tag and attaches:
  # - The .zip (already uploaded as a workflow artifact)
  # - The provenance attestation file (downloaded from the GH
  #   Attestations API after the provenance job completes)
  # =====================================================================
  release:
    name: Create GitHub Release
    needs: [build, provenance]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#lens-v}" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: lens-zip-${{ steps.meta.outputs.version }}
          path: /tmp/lens-artifacts/

      - name: Download provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The provenance job stored its attestation in the GH
          # Attestations store, indexed by the workflow subject (the
          # artifact's SHA-256). Use gh CLI to fetch and save as an
          # asset-friendly file.
          SUBJECT_SHA=$(sha256sum /tmp/lens-artifacts/*.zip | awk '{print $1}' | head -1)
          gh attestation download "$SUBJECT_SHA" \
            --repo "${{ github.repository }}" \
            > "/tmp/lens-artifacts/aegisgate-lens-${{ steps.meta.outputs.version }}.intoto.jsonl"
          ls -la /tmp/lens-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          # Generate release notes (the Lens is a "Lens release",
          # version, and provenance verified).
          NOTES=$(cat <<EOF
          AegisGate Lens v${VERSION}

          This release includes a SLSA Build Level 3 provenance attestation.
          Verify before installing:

          \`\`\`bash
          # Install the SLSA verifier
          go install github.com/slsa-framework/slsa-verifier/cli/slsa-verifier@latest

          # Download the provenance from this release's "Assets" section.
          # Then verify:
          slsa-verifier verify-artifact \\
            --provenance-path aegisgate-lens-${VERSION}.intoto.jsonl \\
            --source-uri github.com/aegisgatesecurity/aegisgate-platform \\
            --source-tag ${TAG} \\
            aegisgate-lens-${VERSION}.zip
          \`\`\`

          A passing verify confirms the ZIP was built by the canonical
          GitHub Actions workflow at github.com/aegisgatesecurity/
          aegisgate-platform/.github/workflows/release-lens.yml.

          See VERIFY.md in this repo for more detail.
          EOF
          )
          gh release create "$TAG" \
            --title "AegisGate Lens v${VERSION}" \
            --notes "$NOTES" \
            /tmp/lens-artifacts/*
          echo "Release $TAG published with $(ls /tmp/lens-artifacts/ | wc -l) assets."
