name: Release Lens with SLSA provenance (debug)

"on":
  push:
    tags:
      - 'lens-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build extension (minimal debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - name: Checkout Lens source at the tagged commit
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-lens
          ref: ${{ github.ref_name }}
          path: lens-src
      - name: Build
        run: |
          mkdir -p /tmp/lens-dist
          go run ./tools/build-lens-extension/ \
            --src lens-src/src \
            --dist /tmp/lens-dist \
            --version "0.0.0-test" \
            --commit "${{ github.sha }}"
      - name: Show artifacts
        run: ls -la /tmp/lens-dist
