name: Release Lens (debug v5 - minimal SLSA call)

"on":
  push:
    tags:
      - 'lens-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#lens-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Platform
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'

      - name: Checkout Lens
        uses: actions/checkout@v6
        with:
          repository: aegisgatesecurity/aegisgate-lens
          ref: ${{ steps.meta.outputs.tag }}
          path: lens-src

      - name: Build
        shell: bash
        run: |
          mkdir -p /tmp/lens-dist
          go run ./tools/build-lens-extension/ \
            --src lens-src/src \
            --dist /tmp/lens-dist \
            --version "0.0.0-test" \
            --commit "${{ github.sha }}"

      - name: Locate ZIP
        shell: bash
        run: |
          ZIP=$(find /tmp -maxdepth 2 -name 'aegisgate-lens-*.zip' -print -quit)
          mkdir -p /tmp/lens-artifacts
          cp "$ZIP" "/tmp/lens-artifacts/aegisgate-lens-test.zip"

      - name: SHA-256
        id: hashes
        shell: bash
        run: |
          HASHES=$(sha256sum /tmp/lens-artifacts/*.zip | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lens-zip
          path: /tmp/lens-artifacts/

  provenance:
    needs: build
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    permissions:
      actions: read
      id-token: write
      contents: read
      attestations: write
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
