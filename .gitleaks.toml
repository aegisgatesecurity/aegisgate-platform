# gitleaks configuration for AegisGate Security Platform v3.4.3
#
# This file is a deliberate, line-precise allowlist for KNOWN FALSE POSITIVES
# that gitleaks would otherwise flag. Each allowlist entry documents:
#   1. The rule being suppressed
#   2. The exact file and line
#   3. The reason
#
# IMPORTANT: Do NOT add broad allowlists (e.g. regex matches, file-level
# exemptions) without founder review. A broad allowlist defeats the purpose
# of the tool. Every entry below is line-specific and traceable to a known
# non-secret pattern.
#
# See: legal-docs/21-self-attestation-v3.4.3/security-posture-v3.4.3.md
# Section 4.4 for the gitleaks false-positive review.
#
# NOTE (v3.4.3 OPSEC): The 3 RSA private keys in upstream/ were rotated after
# a bug report confirmed they had been committed to public GitHub. The .key
# files are gitignored and blocked by the pre-commit hook. The .crt files are
# self-signed test certificates that are tracked (whitelisted in .gitignore).
# Gitleaks should NOT flag the .crt files as they are public certificates.

[allowlist]
  description = "AegisGate v3.3.0 — known false positives"
  regexes = [
    # === Stripe test placeholder constant ===
    # Reason: `sk_test_placeholder` is a deliberate literal placeholder used
    # in the platform's mock-mode detection. It is not a Stripe key. See
    # pkg/billing/stripe.go line 224 for the named constant definition.
    '''sk_test_placeholder''',

    # === MITRE ATLAS technique identifiers ===
    # Reason: AML-T0001-ML-Supply-Chain-Compromise is a public MITRE ATLAS
    # technique name, not a secret. The full technique ID list is in
    # pkg/compliance/community/atlas/atlas.go and is also public on the
    # MITRE ATLAS website.
    '''AML-T[0-9]{4}-ML-[A-Za-z-]+''',

    # === Test JWT license key in cmd/test-email/main.go ===
    # Reason: This is a test fixture used to generate sample license emails.
    # The payload (when decoded) contains `license_id: "test-user-id"`,
    # `tier: "developer"`, `customer: "Test User"`. It is not a real license.
    '''eyJwYXlsb2FkIjp7ImxpY2Vuc2VfaWQiOiJ0ZXN0LXVzZXItaWQi''',

    # === AegisGate public Stripe publishable key (pk_live_...) ===
    # Reason: pk_live_51TT0vSK2DQfk64XN... is the AegisGate public
    # Stripe publishable key. Publishable keys are by design embedded in
    # client-side JavaScript and are not considered secret. (Stripe's
    # pk_live_ keys are explicitly designed to be exposed to the browser.)
    '''pk_live_51TT0vSK2DQfk64XNCkz1nS9rVZEZyUQXUtpS4aylNiMlTqo53fQ0vhif7wskRXnx3GB5o1jMZfAfcAqmB8po1QWI00cIxRUy9u''',
  ]
  paths = [
    # plans/ is gitignored but gitleaks scans history. Allow the known
    # session anchor that has a placeholder.
    '''(^|/)plans/SESSION-ANCHOR\.md$''',
  ]
  stopwords = []
